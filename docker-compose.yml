# Compose de développement / test local uniquement.
# Le déploiement serveur utilise deploy/docker-compose.yaml, qui tire
# l'image publiée sur ghcr.io au lieu de la construire.

services:
  donjon-app:
    container_name: 365-aventures-donjon
    build:
      context: .
      dockerfile: Dockerfile
    image: 365-aventures-donjon:local
    init: true
    ports:
      - "8080:3636"
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-do-not-use-in-production}
    volumes:
      - donjon-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3636/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  donjon-data:
